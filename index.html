<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우주로</title>
<style>
  :root{
    --bg: #04050a;
    --panel-bg: rgba(8, 10, 20, 0.72);
    --panel-border: rgba(140, 170, 255, 0.18);
    --text-main: #e8ecf7;
    --text-dim: #8892b0;
    --accent: #6fb8ff;
    --accent-warm: #ffb870;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--sans); }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #hud-top {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 18px 20px; pointer-events: none; z-index: 10;
  }
  #title-block { pointer-events: none; }
  #title-block h1 {
    font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--text-main); text-shadow: 0 0 20px rgba(111,184,255,0.35);
  }
  #title-block p {
    font-size: 11px; color: var(--text-dim); margin-top: 3px; font-family: var(--mono);
  }

  #controls-bar {
    position: fixed; top: 18px; right: 20px;
    display: flex; gap: 8px; pointer-events: auto; z-index: 10;
  }
  .hud-btn {
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    color: var(--text-main); font-family: var(--sans); font-size: 12px;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    backdrop-filter: blur(10px); transition: border-color 0.15s, background 0.15s;
  }
  .hud-btn:hover { border-color: var(--accent); background: rgba(20,26,44,0.8); }
  .hud-btn.active { border-color: var(--accent); color: var(--accent); }

  #bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; z-index: 10; pointer-events: none;
  }
  #time-panel {
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px 16px; backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 12px; pointer-events: auto;
  }
  #time-panel span { font-size: 11px; color: var(--text-dim); font-family: var(--mono); white-space: nowrap; }
  #speed-slider { width: 120px; accent-color: var(--accent); }
  #speed-val { color: var(--accent); width: 34px; display: inline-block; }

  #info-panel {
    position: fixed; top: 0; right: 0; height: 100%;
    width: 300px; max-width: 82vw;
    background: var(--panel-bg); border-left: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    transform: translateX(100%); transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
    z-index: 20; padding: 70px 22px 22px;
    overflow-y: auto;
  }
  #info-panel.open { transform: translateX(0); }
  #info-panel .close-btn {
    position: absolute; top: 18px; right: 18px;
    background: none; border: none; color: var(--text-dim);
    font-size: 20px; cursor: pointer; line-height: 1; padding: 4px;
  }
  #info-panel .close-btn:hover { color: var(--text-main); }
  #info-panel .kind-tag {
    font-family: var(--mono); font-size: 10px; color: var(--accent-warm);
    letter-spacing: 0.06em; margin-bottom: 6px; display: block;
  }
  #info-panel h2 { font-size: 24px; color: var(--text-main); font-weight: 600; margin-bottom: 4px; }
  #info-panel .en-name { font-size: 12px; color: var(--text-dim); font-family: var(--mono); margin-bottom: 18px; display: block;}
  #info-panel .fact-row {
    display: flex; justify-content: space-between; padding: 9px 0;
    border-bottom: 1px solid rgba(140,170,255,0.08); font-size: 12.5px;
  }
  #info-panel .fact-row .k { color: var(--text-dim); }
  #info-panel .fact-row .v { color: var(--text-main); font-family: var(--mono); text-align: right; }
  #info-panel .desc {
    margin-top: 16px; font-size: 12.5px; line-height: 1.7; color: var(--text-dim);
  }
  #info-panel .discover-tag {
    display: inline-block; margin-top: 14px; font-size: 11px; color: var(--accent);
    background: rgba(111,184,255,0.1); border: 1px solid rgba(111,184,255,0.25);
    padding: 4px 10px; border-radius: 20px; font-family: var(--mono);
  }

  #hint {
    position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--text-dim); font-family: var(--mono);
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    padding: 6px 14px; border-radius: 20px; backdrop-filter: blur(10px);
    pointer-events: none; opacity: 1; transition: opacity 1s;
    z-index: 10; white-space: nowrap;
  }

  #credit {
    position: fixed; bottom: 8px; left: 12px;
    font-size: 10px; color: var(--text-dim); font-family: var(--mono);
    opacity: 0.55; pointer-events: none; z-index: 10; letter-spacing: 0.02em;
  }

  #awe-caption {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    max-width: 480px; width: 86vw;
    text-align: center; font-size: 14px; line-height: 1.7; color: var(--text-main);
    font-style: italic; letter-spacing: 0.01em;
    text-shadow: 0 0 24px rgba(0,0,0,0.9), 0 2px 10px rgba(0,0,0,0.8);
    opacity: 0; transition: opacity 1.8s ease;
    pointer-events: none; z-index: 15;
  }
  #awe-caption.show { opacity: 1; }

  #sky-panel, #diary-panel, #log-panel {
    position: fixed; top: 0; left: 0; height: 100%;
    width: 320px; max-width: 88vw;
    background: var(--panel-bg); border-right: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    transform: translateX(-100%); transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
    z-index: 25; padding: 70px 20px 22px; overflow-y: auto;
  }
  #sky-panel.open, #diary-panel.open { transform: translateX(0); }
  .side-panel-title { font-size: 19px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
  .side-panel-sub { font-size: 11px; color: var(--text-dim); font-family: var(--mono); margin-bottom: 18px; }
  .side-close-btn {
    position: absolute; top: 18px; right: 18px;
    background: none; border: none; color: var(--text-dim);
    font-size: 20px; cursor: pointer; line-height: 1; padding: 4px;
  }
  .side-close-btn:hover { color: var(--text-main); }

  .sky-loc-btn {
    width: 100%; padding: 12px; border-radius: 10px; margin-bottom: 16px;
    background: rgba(111,184,255,0.1); border: 1px solid rgba(111,184,255,0.3);
    color: var(--accent); font-size: 13px; font-family: var(--sans); cursor: pointer;
  }
  .sky-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid rgba(140,170,255,0.08);
  }
  .sky-item .name { font-size: 14px; color: var(--text-main); font-weight: 500; }
  .sky-item .dir { font-size: 11px; color: var(--text-dim); font-family: var(--mono); text-align: right; }
  .sky-item.below { opacity: 0.35; }
  .sky-empty { font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }

  .diary-add-box { margin-bottom: 20px; }
  .diary-add-box textarea {
    width: 100%; min-height: 70px; resize: vertical;
    background: rgba(255,255,255,0.04); border: 1px solid var(--panel-border);
    border-radius: 8px; color: var(--text-main); font-family: var(--sans);
    font-size: 13px; padding: 10px; margin-bottom: 8px;
  }
  .diary-add-box textarea::placeholder { color: var(--text-dim); }
  .diary-save-btn {
    background: var(--accent); color: #04050a; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; float: right;
  }
  .diary-entry {
    padding: 12px 0; border-bottom: 1px solid rgba(140,170,255,0.08); clear: both;
  }
  .diary-entry .d-date { font-size: 10.5px; color: var(--accent-warm); font-family: var(--mono); margin-bottom: 4px; }
  .diary-entry .d-text { font-size: 13px; color: var(--text-main); line-height: 1.6; white-space: pre-wrap; }
  .diary-entry .d-del { font-size: 10.5px; color: var(--text-dim); cursor: pointer; margin-top: 6px; display: inline-block; }
  .diary-entry .d-del:hover { color: #ff8080; }
  .diary-empty { font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }

  #milestone-toast {
    position: fixed; top: 46%; left: 50%; transform: translate(-50%,-50%) scale(0.9);
    text-align: center; z-index: 40; pointer-events: none;
    opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease;
  }
  #milestone-toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #milestone-toast .m-num {
    font-size: 46px; font-weight: 700; color: var(--accent-warm);
    text-shadow: 0 0 30px rgba(255,184,112,0.6); font-family: var(--mono);
  }
  #milestone-toast .m-label {
    font-size: 14px; color: var(--text-main); margin-top: 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }

  .log-progress { font-size: 12px; color: var(--accent); font-family: var(--mono); margin-bottom: 14px; }
  .log-entry {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid rgba(140,170,255,0.08); font-size: 13px;
  }
  .log-entry .l-name { color: var(--text-main); }
  .log-entry .l-date { color: var(--text-dim); font-size: 10.5px; font-family: var(--mono); }
  .log-empty { font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }

  .sky-event {
    background: rgba(255,184,112,0.08); border: 1px solid rgba(255,184,112,0.25);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 12.5px;
    color: var(--text-main); line-height: 1.6;
  }

  #tour-skip {
    position: fixed; bottom: 20px; right: 20px; z-index: 30;
    background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-main);
    font-size: 12px; padding: 8px 14px; border-radius: 20px; backdrop-filter: blur(10px);
    cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  #tour-skip.show { opacity: 1; pointer-events: auto; }

  #loading {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-family: var(--mono); font-size: 12px;
    flex-direction: column; gap: 10px;
  }
  #loading .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  @media (max-width: 560px) {
    #title-block h1 { font-size: 13px; }
    #hint { display: none; }
    #info-panel { width: 100%; max-width: 100%; }
    #sky-panel, #diary-panel, #log-panel { width: 100%; max-width: 100%; }
    #awe-caption { bottom: 96px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="loading"><div class="dot"></div>태양계 좌표 계산 중</div>

  <div id="hud-top">
    <div id="title-block">
      <h1>우주로</h1>
      <p id="date-readout">SIM T+0.0y</p>
    </div>
  </div>

  <div id="controls-bar">
    <button class="hud-btn" id="btn-sky">오늘 밤 하늘</button>
    <button class="hud-btn" id="btn-log">발견 일지</button>
    <button class="hud-btn" id="btn-diary">다이어리</button>
    <button class="hud-btn" id="btn-sound">🔇 소리</button>
    <button class="hud-btn" id="btn-overview">전체보기</button>
    <button class="hud-btn" id="btn-pause">일시정지</button>
  </div>

  <div id="bottom-bar">
    <div id="time-panel">
      <span>공전 속도</span>
      <input type="range" id="speed-slider" min="0" max="200" value="40">
      <span id="speed-val">1.0x</span>
    </div>
  </div>

  <div id="hint">드래그: 시점 회전 · 스크롤: 확대/축소 · 천체 클릭: 이동</div>

  <div id="credit">© 2026 박내연. All rights reserved.</div>

  <div id="awe-caption"></div>

  <div id="sky-panel">
    <button class="side-close-btn" id="btn-close-sky">&times;</button>
    <div class="side-panel-title">오늘 밤 우리 동네 하늘</div>
    <div id="sky-events"></div>
    <div class="side-panel-sub" id="sky-loc-label">위치 정보가 필요해요</div>
    <button class="sky-loc-btn" id="btn-locate">📍 내 위치로 지금 하늘 보기</button>
    <div id="sky-results"></div>
  </div>

  <div id="diary-panel">
    <button class="side-close-btn" id="btn-close-diary">&times;</button>
    <div class="side-panel-title">나의 우주 다이어리</div>
    <div class="side-panel-sub">이 기기에만 저장돼요 · 로그인 없음</div>
    <div class="diary-add-box">
      <textarea id="diary-input" placeholder="오늘 우주를 보며 든 생각을 적어보세요..."></textarea>
      <button class="diary-save-btn" id="btn-diary-save">기록하기</button>
    </div>
    <div id="diary-list"></div>
  </div>

  <div id="log-panel">
    <button class="side-close-btn" id="btn-close-log">&times;</button>
    <div class="side-panel-title">나의 발견 일지</div>
    <div class="log-progress" id="log-progress">0개 발견</div>
    <div id="log-list"></div>
  </div>

  <div id="milestone-toast">
    <div class="m-num" id="m-num">10</div>
    <div class="m-label" id="m-label">번째 천체를 발견했어요!</div>
  </div>

  <button id="tour-skip">건너뛰기 ▸</button>

  <div id="info-panel">
    <button class="close-btn" id="btn-close-panel">&times;</button>
    <span class="kind-tag" id="p-kind">PLANET</span>
    <h2 id="p-name">-</h2>
    <span class="en-name" id="p-en">-</span>
    <div id="p-facts"></div>
    <div class="desc" id="p-desc"></div>
    <span class="discover-tag" id="p-discover" style="display:none;">✦ 지금 발견한 소행성</span>
  </div>
</div>

<script>
(function(){

  const DEG2RAD = Math.PI/180;

  // ---------- 기본 씬 설정 ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 4000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('app').appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- 조명 ----------
  scene.add(new THREE.AmbientLight(0x30344a, 0.55));
  const sunLight = new THREE.PointLight(0xffffff, 2.4, 0, 0);
  scene.add(sunLight);

  // ---------- 별 배경 ----------
  function buildStarfield(){
    const count = 6000;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++){
      const r = 800 + Math.random() * 1200;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2*Math.random() - 1);
      positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.cos(phi);
      positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, sizeAttenuation: false, transparent: true, opacity: 0.85 });
    scene.add(new THREE.Points(geo, mat));
  }
  buildStarfield();

  // ---------- 라벨 스프라이트 생성 ----------
  function makeLabel(text, color, fontPx){
    const canvas = document.createElement('canvas');
    const scale = 4;
    canvas.width = 256 * scale; canvas.height = 64 * scale;
    const ctx = canvas.getContext('2d');
    ctx.font = `${(fontPx||28)*scale}px -apple-system, sans-serif`;
    ctx.fillStyle = color || '#dfe6f5';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 10*scale;
    ctx.fillText(text, canvas.width/2, canvas.height/2);
    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, opacity: 0.9 });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(8, 2, 1);
    sprite.renderOrder = 999;
    return sprite;
  }

  // ---------- 태양 ----------
  const SUN_RADIUS = 6;
  const sunGeo = new THREE.SphereGeometry(SUN_RADIUS, 48, 48);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd27a });
  const sunMesh = new THREE.Mesh(sunGeo, sunMat);
  sunMesh.userData = { isBody: true, kind: 'sun', key: 'sun' };
  scene.add(sunMesh);

  // ---------- 거리 축척: 실제 AU -> 화면 모델 거리 (구간별 선형보간) ----------
  // 제어점: [실제 AU, 모델 거리] - 행성/왜소행성 배치와 시각적으로 어울리도록 압축
  const SCALE_POINTS = [
    [0, 0], [0.39, 12], [0.72, 16], [1.0, 20], [1.52, 25],
    [2.0, 29], [3.3, 38], [4.0, 42], [5.2, 45], [9.58, 58],
    [19.2, 70], [30.1, 82], [39.5, 94], [50, 102], [67.7, 118],
    [100, 128], [200, 140], [500, 155]
  ];
  function auToModel(a){
    if (a <= SCALE_POINTS[0][0]) return SCALE_POINTS[0][1];
    for (let i=1;i<SCALE_POINTS.length;i++){
      if (a <= SCALE_POINTS[i][0]){
        const [a0,d0] = SCALE_POINTS[i-1], [a1,d1] = SCALE_POINTS[i];
        const t = (a-a0)/(a1-a0);
        return d0 + t*(d1-d0);
      }
    }
    return SCALE_POINTS[SCALE_POINTS.length-1][1];
  }
  function scaleFactorFor(a){ return a > 0 ? auToModel(a)/a : 1; }

  // ---------- 케플러 궤도 -> 3D 좌표 변환 ----------
  function solveEccentricAnomaly(Mrad, e){
    let E = Mrad;
    for (let k=0;k<8;k++){
      E = E - (E - e*Math.sin(E) - Mrad) / (1 - e*Math.cos(E));
    }
    return E;
  }
  // E(편심근점이각, rad)로부터 궤도면 내 좌표 계산 후 w,i,N 회전 적용. 반환은 "실제 AU" 좌표.
  function orbitFrameFromE(a, e, i, w, N, E){
    const xOrb = a*(Math.cos(E)-e);
    const yOrb = a*Math.sqrt(1-e*e)*Math.sin(E);
    const cosW=Math.cos(w), sinW=Math.sin(w);
    const cosI=Math.cos(i), sinI=Math.sin(i);
    const cosN=Math.cos(N), sinN=Math.sin(N);
    const xw = xOrb*cosW - yOrb*sinW;
    const yw = xOrb*sinW + yOrb*cosW;
    const xi = xw;
    const yi = yw*cosI;
    const zi = yw*sinI;
    const X = xi*cosN - yi*sinN;
    const Y = xi*sinN + yi*cosN;
    const Z = zi;
    return [X, Y, Z]; // ecliptic AU 좌표 (X,Y 궤도면, Z 수직)
  }
  function keplerPositionModel(a, e, i_deg, w_deg, N_deg, M_deg){
    const i = i_deg*DEG2RAD, w = w_deg*DEG2RAD, N = N_deg*DEG2RAD;
    const E = solveEccentricAnomaly(M_deg*DEG2RAD, e);
    const [X,Y,Z] = orbitFrameFromE(a, e, i, w, N, E);
    const sf = scaleFactorFor(a);
    return new THREE.Vector3(X*sf, Z*sf, Y*sf); // three.js: y가 위(수직)
  }
  function orbitLinePoints(a, e, i_deg, w_deg, N_deg, segs){
    const i = i_deg*DEG2RAD, w = w_deg*DEG2RAD, N = N_deg*DEG2RAD;
    const sf = scaleFactorFor(a);
    const pts = [];
    const n = segs || 96;
    for (let s=0;s<=n;s++){
      const E = (s/n)*Math.PI*2;
      const [X,Y,Z] = orbitFrameFromE(a, e, i, w, N, E);
      pts.push(new THREE.Vector3(X*sf, Z*sf, Y*sf));
    }
    return pts;
  }

  const EARTH_DEG_PER_SEC = 360/26; // 애니메이션 기준(지구가 26초에 한 바퀴)
  function angularSpeedDegPerSec(a_au){ return EARTH_DEG_PER_SEC / Math.pow(a_au, 1.5); }

  let isDragging = false, dragMoved = false, lastX=0, lastY=0;

    if (!isDragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
    camState.targetTheta -= dx * 0.005;
    camState.targetPhi = Math.max(0.15, Math.min(Math.PI-0.15, camState.targetPhi - dy*0.005));

  const raycaster = new THREE.Raycaster();

    const solidMeshes = Object.values(bodyMeshes).concat(Object.values(asteroidMeshes)).concat([sunMesh]);

      const ud = hits[0].object.userData;
      focusOnBody(ud.kind, ud.key);
      return;
    }
    // 배경 소행성 점 클릭 검사
    const fieldHits = raycaster.intersectObject(fieldPoints, false);
    if (fieldHits.length){
      const idx = fieldHits[0].index;
      const row = fieldRows[idx];
      focusOnField(row, fieldHits[0].point);
    }
  }

  // JPL 저정밀 케플러 요소(J2000.0 기준, 100년당 변화율). a(AU), e, i(deg), L(deg), 근일점경도(deg), 승교점경도(deg)
  const REAL_ELEMENTS = {

  const SKY_NAMES = {mercury:'수성', venus:'금성', mars:'화성', jupiter:'목성', saturn:'토성', uranus:'천왕성', neptune:'해왕성'};
  function norm360(d){ d = d % 360; return d < 0 ? d+360 : d; }
  function julianDate(date){ return date.getTime()/86400000 + 2440587.5; }
  function realElementsAt(key, T){
    const el = REAL_ELEMENTS[key];
    const a = el.a[0] + el.a[1]*T;
    const e = el.e[0] + el.e[1]*T;
    const i = el.i[0] + el.i[1]*T;
    const L = el.L[0] + el.L[1]*T;
    const wbar = el.wbar[0] + el.wbar[1]*T;
    const N = el.N[0] + el.N[1]*T;
    const w = wbar - N;
    let M = norm360(L - wbar);
    return {a,e,i,w:norm360(w),N:norm360(N),M};
  }
  function realHeliocentricAU(a,e,i_deg,w_deg,N_deg,M_deg){
    const i=i_deg*DEG2RAD, w=w_deg*DEG2RAD, N=N_deg*DEG2RAD;
    const E = solveEccentricAnomaly(M_deg*DEG2RAD, e);
    return orbitFrameFromE(a,e,i,w,N,E); // [X,Y,Z] AU, ecliptic
  }
  function computeSkyNow(lat, lon){
    const now = new Date();
    const JD = julianDate(now);
    const T = (JD - 2451545.0)/36525;
    const earthEl = realElementsAt('earth', T);
    const [ex,ey,ez] = realHeliocentricAU(earthEl.a, earthEl.e, earthEl.i, earthEl.w, earthEl.N, earthEl.M);
    const OBLIQ = 23.4393*DEG2RAD;

    // 그리니치 항성시(GMST) 계산
    const JD0 = Math.floor(JD-0.5)+0.5;
    const T0 = (JD0-2451545.0)/36525;
    const UTh = (JD - JD0)*24;
    let GMST = 100.46061837 + 36000.770053608*T0 + 0.000387933*T0*T0 - (T0*T0*T0)/38710000;
    GMST = norm360(GMST + 360.98564736629*(JD-JD0));
    const LST = norm360(GMST + lon);

    const results = [];
    Object.keys(REAL_ELEMENTS).forEach(key => {
      if (key === 'earth') return;
      const el = realElementsAt(key, T);
      const [px,py,pz] = realHeliocentricAU(el.a, el.e, el.i, el.w, el.N, el.M);
      const gx = px-ex, gy = py-ey, gz = pz-ez;
      // 황도 -> 적도 좌표
      const yEq = gy*Math.cos(OBLIQ) - gz*Math.sin(OBLIQ);
      const zEq = gy*Math.sin(OBLIQ) + gz*Math.cos(OBLIQ);
      const xEq = gx;
      const r = Math.sqrt(xEq*xEq+yEq*yEq+zEq*zEq);
      let RA = Math.atan2(yEq, xEq)*180/Math.PI; RA = norm360(RA);
      const Dec = Math.asin(zEq/r)*180/Math.PI;
      const H = norm360(LST - RA)*DEG2RAD;
      const latR = lat*DEG2RAD, decR = Dec*DEG2RAD;
      const sinAlt = Math.sin(latR)*Math.sin(decR) + Math.cos(latR)*Math.cos(decR)*Math.cos(H);
      const alt = Math.asin(sinAlt)*180/Math.PI;
      let cosAz = (Math.sin(decR) - Math.sin(latR)*sinAlt) / (Math.cos(latR)*Math.cos(Math.asin(sinAlt)));
      cosAz = Math.max(-1, Math.min(1, cosAz));
      let az = Math.acos(cosAz)*180/Math.PI;
      if (Math.sin(H) > 0) az = 360 - az;
      results.push({key, name: SKY_NAMES[key], alt, az});
    });
    return results;
  }

  // =========================================================
  // ④ 우주의 소리 — 절차적으로 생성한 앰비언트 사운드(실제 오디오 파일 아님, Web Audio로 실시간 합성)
  // =========================================================
  let audioCtx = null, masterGain = null, droneOsc = null, droneGain = null, noiseSrc = null, noiseFilter = null;
  let soundOn = false;
  const BODY_TONE_HZ = {
    sun: 65, mercury: 220, venus: 196, earth: 174, mars: 164,
    jupiter: 98, saturn: 87, uranus: 73, neptune: 55, pluto: 130, eris: 110
  };
  function initAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    // 배경 화이트노이즈를 저역통과 필터로 걸러 우주 공간의 '숨소리' 같은 질감을 만듦
    const bufSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1)*0.5;
    noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = buffer; noiseSrc.loop = true;
    noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = 220;
    const noiseGain = audioCtx.createGain(); noiseGain.gain.value = 0.35;
    noiseSrc.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterGain);
    noiseSrc.start();

    // 초점 천체에 따라 음높이가 달라지는 드론(저음)
    droneOsc = audioCtx.createOscillator();
    droneOsc.type = 'sine'; droneOsc.frequency.value = BODY_TONE_HZ.sun;
    droneGain = audioCtx.createGain(); droneGain.gain.value = 0.22;
    droneOsc.connect(droneGain); droneGain.connect(masterGain);
    droneOsc.start();

    // 아주 느린 트레몰로(LFO)
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.08;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.06;
    lfo.connect(lfoGain); lfoGain.connect(droneGain.gain);
    lfo.start();
  }
  function setSoundTone(key){
    if (!audioCtx || !droneOsc) return;
    const hz = BODY_TONE_HZ[key] || 140;
    droneOsc.frequency.setTargetAtTime(hz, audioCtx.currentTime, 1.2);
  }
  document.getElementById('btn-sound').addEventListener('click', (e) => {
    initAudio();
    soundOn = !soundOn;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    masterGain.gain.setTargetAtTime(soundOn ? 1 : 0, audioCtx.currentTime, 0.8);
    e.target.textContent = soundOn ? '🔊 소리' : '🔇 소리';
    e.target.classList.toggle('active', soundOn);
  });

  // =========================================================
  // ⑥ 나의 우주 다이어리 — 이 기기의 localStorage에만 저장 (서버/로그인 없음)
  // =========================================================
  const DIARY_KEY = 'cosmos_diary_entries_v1';
  function loadDiary(){
    try { return JSON.parse(localStorage.getItem(DIARY_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function saveDiary(entries){
    try { localStorage.setItem(DIARY_KEY, JSON.stringify(entries)); return true; }
    catch(e){ return false; }
  }
  function renderDiary(){
    const list = document.getElementById('diary-list');
    const entries = loadDiary().slice().sort((a,b)=> b.ts - a.ts);
    if (entries.length===0){
      list.innerHTML = '<div class="diary-empty">아직 기록이 없어요. 오늘 본 하늘이나 방금 발견한 소행성에 대해 한 줄 남겨보세요.</div>';
      return;
    }
    list.innerHTML = entries.map(en => {
      const d = new Date(en.ts);
      const dateStr = d.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
      return `<div class="diary-entry" data-id="${en.ts}">
        <div class="d-date">${dateStr}</div>
        <div class="d-text"></div>
        <span class="d-del">삭제</span>
      </div>`;
    }).join('');
    // XSS 방지를 위해 textContent로 안전하게 채움
    const nodes = list.querySelectorAll('.diary-entry');
    nodes.forEach((node, idx) => {
      node.querySelector('.d-text').textContent = entries[idx].text;
      node.querySelector('.d-del').addEventListener('click', () => {
        const ts = Number(node.dataset.id);
        const remain = loadDiary().filter(e => e.ts !== ts);
        saveDiary(remain);
        renderDiary();
      });
    });
  }
  document.getElementById('btn-diary').addEventListener('click', () => {
    renderDiary();
    document.getElementById('diary-panel').classList.add('open');
  });
  document.getElementById('btn-close-diary').addEventListener('click', () => {
    document.getElementById('diary-panel').classList.remove('open');
  });
  document.getElementById('btn-diary-save').addEventListener('click', () => {
    const ta = document.getElementById('diary-input');
    const text = ta.value.trim();
    if (!text) return;
    const entries = loadDiary();
    entries.push({ ts: Date.now(), text });
    if (saveDiary(entries)){
      ta.value = '';
      renderDiary();
    }
  });

  // =========================================================
  // 나의 발견 일지 — 클릭해서 발견한 소행성을 localStorage에 누적 기록 (API 없음)
  // =========================================================
  const LOG_KEY = 'cosmos_discovery_log_v1';
  function loadLog(){
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function saveLog(arr){
    try { localStorage.setItem(LOG_KEY, JSON.stringify(arr)); return true; }
    catch(e){ return false; }
  }
  const MILESTONES = [10,25,50,100,250,500,1000,2000];
  function showMilestone(num, label){
    const el = document.getElementById('milestone-toast');
    document.getElementById('m-num').textContent = num.toLocaleString();
    document.getElementById('m-label').textContent = label;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3400);
  }
  function checkMilestone(count){
    if (count === ASTEROID_DATA.length){
      showMilestone(count, '태양계의 모든 소행성을 발견했어요. 진짜 천문학자시네요.');
    } else if (MILESTONES.includes(count)){
      showMilestone(count, '번째 소행성을 발견했어요!');
    }
  }
  function recordDiscovery(name, group, isHero){
    const log = loadLog();
    if (log.find(e => e.name === name)) return;
    log.push({ name, ts: Date.now(), group, isHero: !!isHero });
    saveLog(log);
    checkMilestone(log.length);
    if (document.getElementById('log-panel').classList.contains('open')) renderLog();
  }
  function renderLog(){
    const log = loadLog().slice().sort((a,b) => b.ts - a.ts);
    document.getElementById('log-progress').textContent = `${log.length.toLocaleString()} / ${ASTEROID_DATA.length.toLocaleString()}개 발견`;
    const box = document.getElementById('log-list');
    if (log.length === 0){
      box.innerHTML = '<div class="log-empty">아직 발견한 소행성이 없어요. 소행성대의 작은 점들을 클릭해보세요.</div>';
      return;
    }
    box.innerHTML = log.map(e => {
      const d = new Date(e.ts);
      const dateStr = d.toLocaleDateString('ko-KR');
      return `<div class="log-entry"><span class="l-name">${e.name}${e.isHero ? ' ✦' : ''}</span><span class="l-date">${dateStr}</span></div>`;
    }).join('');
  }
  document.getElementById('btn-log').addEventListener('click', () => {
    renderLog();
    document.getElementById('log-panel').classList.add('open');
  });
  document.getElementById('btn-close-log').addEventListener('click', () => {
    document.getElementById('log-panel').classList.remove('open');
  });

  // =========================================================
  // 달의 위상 + 유성우 — 직접 계산(달) / 고정 달력표(유성우), API 없음
  // =========================================================
  function getMoonPhase(date){
    const knownNewMoon = Date.UTC(2000,0,6,18,14,0);
    const synodic = 29.530588853;
    const diffDays = (date.getTime()-knownNewMoon)/86400000;
    let frac = (diffDays % synodic)/synodic;
    if (frac < 0) frac += 1;
    const illum = Math.round((1-Math.cos(2*Math.PI*frac))/2*100);
    let name;
    if (frac<0.03 || frac>0.97) name='신월(New Moon)';
    else if (frac<0.22) name='초승달';
    else if (frac<0.28) name='상현달';
    else if (frac<0.47) name='차오르는 달';
    else if (frac<0.53) name='보름달';
    else if (frac<0.72) name='이지러지는 달';
    else if (frac<0.78) name='하현달';
    else name='그믐달';
    return { name, illum };
  }
  const METEOR_SHOWERS = [
    { name:'사분의자리 유성우', month:1, day:3 },
    { name:'물병자리 에타 유성우', month:5, day:5 },
    { name:'페르세우스자리 유성우', month:8, day:12 },
    { name:'오리온자리 유성우', month:10, day:21 },
    { name:'사자자리 유성우', month:11, day:17 },
    { name:'쌍둥이자리 유성우', month:12, day:13 },
  ];
  function nearestShower(date){
    const y = date.getFullYear();
    let best = null;
    METEOR_SHOWERS.forEach(s => {
      [y-1,y,y+1].forEach(yy => {
        const peak = new Date(yy, s.month-1, s.day);
        const diffDays = Math.round((peak - date)/86400000);
        if (best === null || Math.abs(diffDays) < Math.abs(best.diffDays)){
          best = { name: s.name, diffDays };
        }
      });
    });
    return best;
  }
  function renderSkyEvents(){
    const now = new Date();
    const moon = getMoonPhase(now);
    const shower = nearestShower(now);
    let showerHtml;
    if (Math.abs(shower.diffDays) <= 4){
      showerHtml = `🌠 <b>${shower.name}</b>가 지금 활동 중이에요!`;
    } else if (shower.diffDays > 0){
      showerHtml = `다음 유성우: <b>${shower.name}</b> (D-${shower.diffDays})`;
    } else {
      showerHtml = `가장 최근 유성우: ${shower.name} (${-shower.diffDays}일 전)`;
    }
    document.getElementById('sky-events').innerHTML =
      `<div class="sky-event">🌙 오늘의 달: <b>${moon.name}</b> · 밝기 약 ${moon.illum}%</div>` +
      `<div class="sky-event">${showerHtml}</div>`;
  }

  // =========================================================
  // 첫 방문 자동 카메라 투어 — 조작 없이도 신기함을 먼저 보여줌
  // =========================================================
  function startIntroTour(){
    const skipBtn = document.getElementById('tour-skip');
    skipBtn.classList.add('show');
    const order = [['sun','sun'],['planet','mercury'],['planet','venus'],['planet','earth'],
                    ['planet','mars'],['planet','jupiter'],['planet','saturn'],['planet','uranus'],
                    ['planet','neptune'],['planet','pluto']];
    let idx = -1;
    let tourActive = true;
    let tourTimer = null;
    function stopTour(){
      if (!tourActive) return;
      tourActive = false;
      clearInterval(tourTimer);
      skipBtn.classList.remove('show');
      try { localStorage.setItem('toured_v1','1'); } catch(e){}
      closeInfoPanel();
      camState.followKey = null; camState.followKind = null;
      camState.target.set(0,0,0);
      camState.targetTheta = 0.9; camState.targetPhi = 1.05; camState.targetRadius = 130;
      setTimeout(() => showAwe('이제 직접 탐험해보세요. 드래그로 둘러보고, 궁금한 천체를 클릭해보세요.', 6500), 400);
    }
    function nextStop(){
      idx++;
      if (idx >= order.length){ stopTour(); return; }
      focusOnBody(order[idx][0], order[idx][1]);
    }
    nextStop();
    tourTimer = setInterval(nextStop, 3200);
    skipBtn.onclick = stopTour;
    dom.addEventListener('pointerdown', () => { if (tourActive) stopTour(); }, { once:true });
  }

  // ---------- 로딩 제거 ----------
  document.getElementById('loading').style.display = 'none';
  let hasToured = false;
  try { hasToured = localStorage.getItem('toured_v1') === '1'; } catch(e){}
  if (!hasToured){
    setTimeout(() => {
      showAwe('여기, 태양계 안으로 들어오신 것을 환영합니다. 잠시 함께 둘러볼게요.', 3000);
      setTimeout(startIntroTour, 2600);
    }, 1200);
  } else {
    setTimeout(() => {
      showAwe('다시 오신 것을 환영합니다.', 4500);
    }, 1200);
  }

  // ---------- 애니메이션 루프 ----------
  const clock = new THREE.Clock();
  let frameCount = 0;

  function animate(){
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);
    if (!isPaused){
      simTime += delta * timeScale;
    }
    frameCount++;

    // 행성/왜소행성 위치 갱신
    BODIES.forEach(b => {
      const mesh = bodyMeshes[b.key];
      const Mdeg = (b.M0 + mesh.userData.angSpeed * simTime) % 360;
      const p = keplerPositionModel(b.a, b.e, b.i, b.w, b.N, Mdeg);
      mesh.position.copy(p);
      mesh.rotation.y += b.spin * (isPaused?0:timeScale);
      if (mesh.userData.moon){
        mesh.userData.moon.position.x = Math.cos(simTime*0.6) * b.radius*2.6;
        mesh.userData.moon.position.z = Math.sin(simTime*0.6) * b.radius*2.6;
      }
    });

    // 대표(hero) 소행성 위치 갱신
    heroRows.forEach(row => {
      const [name, a, e, i, w, N, M0] = row;
      const mesh = asteroidMeshes[name];
      const Mdeg = (M0 + mesh.userData.angSpeed * simTime) % 360;
      mesh.position.copy(keplerPositionModel(a, e, i, w, N, Mdeg));
    });

    // 배경 소행성: 매 프레임 전부 갱신하면 부담이 적당히 있어 2프레임에 한 번 갱신
    if (frameCount % 2 === 0) updateFieldAsteroidPositions(simTime);

    // 카메라: 포커스 대상 추적
    if (camState.followKind === 'sun'){
      camState.target.lerp(sunMesh.position, 0.08);
    } else if (camState.followKind === 'planet'){
      camState.target.lerp(bodyMeshes[camState.followKey].position, 0.08);
    } else if (camState.followKind === 'asteroid'){
      camState.target.lerp(asteroidMeshes[camState.followKey].position, 0.08);
    } else if (camState.followKind !== 'field') {
      camState.target.lerp(new THREE.Vector3(0,0,0), 0.08);
    }

    camState.theta += (camState.targetTheta - camState.theta) * 0.12;
    camState.phi += (camState.targetPhi - camState.phi) * 0.12;
    camState.radius += (camState.targetRadius - camState.radius) * 0.08;
    updateCameraFromSpherical();

    sunLight.position.copy(sunMesh.position);

    const years = simTime * (EARTH_DEG_PER_SEC/360);
    document.getElementById('date-readout').textContent = `SIM T+${years.toFixed(1)}y`;

    renderer.render(scene, camera);
  }
  updateCameraFromSpherical();
  updateFieldAsteroidPositions(0);
  animate();

})();
</script>
</body>
</html>
